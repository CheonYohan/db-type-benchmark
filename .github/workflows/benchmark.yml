name: Database type benchmark
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark.yml
      - bench.py
      - dataset.py
      - engines.py
      - compose.yaml
      - requirements.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DB clients
        run: python -m pip install -r requirements.txt
      - name: Start database servers
        run: docker compose up -d --wait --wait-timeout 180
      - name: Measure and verify
        run: python bench.py --output results/ci.json --export-data results/dataset.jsonl
      - name: Publish measurements
        if: always()
        shell: bash
        run: |
          if [ -f results/ci.json ]; then
            cat results/ci.json
            cat results/ci.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-type-benchmark
          path: |
            results/ci.json
            results/ci.md
            results/dataset.jsonl
      - name: Collect server diagnostics on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop database servers
        if: always()
        run: docker compose down --volumes
